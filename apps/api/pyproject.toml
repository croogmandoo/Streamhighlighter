[project]
name = "streamhighlighter-api"
version = "0.1.0"
description = "VOD ingestion + AI editing pipeline for StreamHighlighter"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "boto3>=1.34",            # S3-compatible object storage
    "httpx>=0.27",
    "anthropic>=0.40",       # LLM humor scoring
    "yt-dlp>=2024.0",        # Twitch/YouTube VOD retrieval
    "numpy>=1.26",
    # Heavier optional deps pulled in real milestones:
    # "faster-whisper", "librosa", "soundfile"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
