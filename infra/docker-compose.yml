# Local dev stack. Bring up just the datastores for hybrid dev:
#   docker compose -f infra/docker-compose.yml up -d postgres redis
# Or the whole thing:
#   docker compose -f infra/docker-compose.yml up --build
version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shighlight
      POSTGRES_PASSWORD: shighlight
      POSTGRES_DB: streamhighlighter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shighlight"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO gives an S3-compatible object store for local media in/out.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info -Q default,gpu,render
    env_file: ../.env
    depends_on:
      - api
      - redis

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    command: npm run start
    env_file: ../.env
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
